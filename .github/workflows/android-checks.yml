name: Android Checks

on:
  workflow_dispatch:
    inputs:
      build_apk:
        description: Build the debug APK after running tests
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-checks
  cancel-in-progress: true

jobs:
  android:
    name: Gradle tests and Android build
    runs-on: ubuntu-24.04
    env:
      BUILD_TOOLS_VERSION: "36.0.0"
      NDK_VERSION: "30.0.15729638"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "ndk;${NDK_VERSION}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Configure Android API endpoint
        shell: bash
        run: printf 'VITE_API_BASE_URL=https://example.invalid\n' > frontend/.env.desktop

      - name: Initialize Tauri Android project
        working-directory: frontend
        run: bun run tauri android init

      - name: Run Android unit tests and Kotlin compilation
        working-directory: frontend/src-tauri/gen/android
        run: ./gradlew :app:testDebugUnitTest :app:compileDebugKotlin

      - name: Build debug APK
        if: ${{ inputs.build_apk }}
        working-directory: frontend/src-tauri/gen/android
        run: ./gradlew :app:assembleDebug
