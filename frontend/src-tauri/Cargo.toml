[package]
name = "radyjko"
version = "0.1.0"
description = "Radyjko desktop"
authors = ["Radyjko"]
edition = "2021"

[lib]
name = "radyjko_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
discord-rich-presence = "1.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["image-png"] }
